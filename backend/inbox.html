<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drawing Inbox</title><style>
:root{font:14px system-ui;color-scheme:light dark}body{max-width:1000px;margin:32px auto;padding:0 20px}header{display:flex;align-items:center;gap:12px}h1{font-size:22px;margin-right:auto}button,input,textarea{font:inherit}button{padding:8px 14px;cursor:pointer}textarea{box-sizing:border-box;width:100%;height:90px;margin:12px 0;padding:10px}#drawings{display:flex;flex-wrap:wrap;gap:20px}article{padding:12px;border:1px solid #8885}canvas{display:block;width:250px;height:250px;image-rendering:pixelated;background:white;margin-bottom:10px}small{display:block;margin:8px 0;color:gray}#error{color:#c44}
</style><header><h1>Drawing Inbox</h1><button id="newer" disabled title="Newer drawings">←</button><button id="older" disabled title="Older drawings">→</button><button id="refresh" disabled>Refresh</button><button id="disconnect" hidden>Disconnect</button></header><form id="connect"><input id="token" type="password" placeholder="Inbox key" aria-label="Inbox key" autocomplete="off" required><label><input id="remember" type="checkbox"> Remember on this Mac</label><button>Connect</button></form><details><summary>Open drawing data</summary><label>Open JSON <input id="file" type="file" accept=".json,application/json"></label><textarea id="source" placeholder="Paste the strokes value from Cloudflare" aria-label="Drawing data"></textarea><button id="open">Open drawing</button></details><p id="error" role="status"></p><div id="drawings"></div><script>
const $=id=>document.getElementById(id);
function flood(c,p,color){const image=c.getImageData(0,0,250,250),d=image.data,start=Math.min(249,Math.round(p[1]*250))*250+Math.min(249,Math.round(p[0]*250)),at=start*4,target=Array.from(d.slice(at,at+4)),replacement=[parseInt(color.slice(1,3),16),parseInt(color.slice(3,5),16),parseInt(color.slice(5,7),16),255];if(target.every((n,i)=>n===replacement[i]))return;const queue=new Int32Array(62500);let head=0,tail=0;function add(index){const o=index*4;if(target.some((n,i)=>d[o+i]!==n))return;for(let i=0;i<4;i++)d[o+i]=replacement[i];queue[tail++]=index}add(start);while(head<tail){const n=queue[head++],x=n%250;if(x>0)add(n-1);if(x<249)add(n+1);if(n>=250)add(n-250);if(n<62250)add(n+250)}c.putImageData(image,0,0)}
function stamp(c,x,y,s){const n=Math.round(s.size),r=n/2,m=n/2-.5; c.fillStyle=s.color;for(let dy=0;dy<n;dy++)for(let dx=0;dx<n;dx++)if((dx-m)**2+(dy-m)**2<=r*r+.1)c.fillRect(x-Math.floor(n/2)+dx,y-Math.floor(n/2)+dy,1,1)}
function segment(c,a,b,s){let x=Math.round(a[0]*250),y=Math.round(a[1]*250);const tx=Math.round(b[0]*250),ty=Math.round(b[1]*250),dx=Math.abs(tx-x),sx=x<tx?1:-1,dy=-Math.abs(ty-y),sy=y<ty?1:-1;let err=dx+dy;while(true){stamp(c,x,y,s);if(x===tx&&y===ty)break;const e=2*err;if(e>=dy){err+=dy;x+=sx}if(e<=dx){err+=dx;y+=sy}}}
function renderWork(strokes){let work=0;for(const s of strokes){
 if(s.tool==='fill'){work+=62500}else{const n=Math.round(s.size);let steps=1;for(let i=1;i<s.points.length;i++)steps+=Math.max(Math.abs(Math.round(s.points[i][0]*250)-Math.round(s.points[i-1][0]*250)),Math.abs(Math.round(s.points[i][1]*250)-Math.round(s.points[i-1][1]*250)))+1;work+=steps*n*n}
 if(work>8000000)throw Error('Drawing is too complex. Use fewer strokes or a smaller brush.');
 }return work}

async function show(text){const version=generation;try{let rows=JSON.parse(text);if(typeof rows==='string')rows=JSON.parse(rows);if(rows?.results)rows=rows.results;if(!Array.isArray(rows))rows=[rows];if(rows[0]?.points)rows=[{strokes:rows}];if(rows.length>20)throw Error('Too many drawings.');const cards=[];for(const row of rows){await new Promise(resolve=>requestAnimationFrame(resolve));if(version!==generation)return false;const strokes=typeof row.strokes==='string'?JSON.parse(row.strokes):row.strokes;if(!Array.isArray(strokes)||strokes.length>300)throw Error('Expected drawing strokes.');let total=0;for(const s of strokes){if(!s||!/^#[0-9a-f]{6}$/i.test(s.color)||!Number.isFinite(s.size)||s.size<1||s.size>40||!Array.isArray(s.points)||!s.points.length||(s.tool!==undefined&&s.tool!=='fill')||(s.tool==='fill'&&s.points.length!==1)||(total+=s.points.length)>20000||s.points.some(p=>!Array.isArray(p)||p.length!==2||p.some(n=>!Number.isFinite(n)||n<0||n>1)))throw Error('Invalid drawing data.');}renderWork(strokes);const card=document.createElement('article'),canvas=document.createElement('canvas');canvas.width=canvas.height=250;const c=canvas.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,250,250);for(const s of strokes){if(s.tool==='fill'){flood(c,s.points[0],s.color);continue}if(s.points.length===1)stamp(c,Math.round(s.points[0][0]*250),Math.round(s.points[0][1]*250),s);else for(let i=1;i<s.points.length;i++)segment(c,s.points[i-1],s.points[i],s)}const button=document.createElement('button');button.textContent='Save PNG';button.onclick=()=>{const a=document.createElement('a');a.download='drawing-'+String(row.id||'export').replace(/[^a-z0-9-]/gi,'').slice(0,60)+'.png';a.href=canvas.toDataURL('image/png');a.click()};card.append(canvas);if(typeof row.message==='string'&&row.message){const message=document.createElement('p');message.textContent=row.message.slice(0,1000);card.append(message)}card.append(button);cards.push(card)}if(version!==generation)return false;$('drawings').replaceChildren(...cards);$('error').textContent='';return true}catch(e){$('error').textContent=e.message;return false}}
$('open').onclick=()=>show($('source').value);$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(file.size>25000000){$('error').textContent='File is too large.';return}show(await file.text())};

const automatic=location.origin==='http://127.0.0.1:4319';let pageCursor=null,pageNext=null,pageHistory=[];let key='',controller=null,generation=0,poll=null;
const storageKey='canvasstudio-private-inbox-key';
function stop(){generation++;controller?.abort();clearTimeout(poll);controller=null;poll=null}
function rememberKey(){if(automatic)return;try{sessionStorage.setItem(storageKey,key);if($('remember').checked)localStorage.setItem(storageKey,key);else localStorage.removeItem(storageKey)}catch{}}
async function refresh(){stop();if(!key)return;const current=generation;controller=new AbortController();const requestController=controller;const timer=setTimeout(()=>requestController.abort(),20000);$('refresh').disabled=true;try{const rows=[];let next=pageCursor;do{const params=next?'?'+new URLSearchParams(next):'';const response=await fetch((automatic?'/api/inbox':'https://drawbox.example.invalid/api/inbox')+params,{headers:automatic?{}:{Authorization:'Bearer '+key},signal:controller.signal,cache:'no-store',credentials:'omit'});const data=await response.json();if(!response.ok)throw Error(data.error||'Could not load drawings.');if(current!==generation)return;rows.push(...data.drawings);next=data.next;}while(false);pageNext=next;$('older').disabled=!next;$('newer').disabled=!pageHistory.length;if(current!==generation)return;if(!await show(JSON.stringify(rows)))return;$('connect').hidden=true;$('disconnect').hidden=automatic;rememberKey();if(!rows.length)$('error').textContent='No drawings yet.'}catch(e){if(current===generation)$('error').textContent=e.name==='AbortError'?'Connection timed out. Try Refresh.':e.message}finally{clearTimeout(timer);if(current===generation){$('refresh').disabled=false;controller=null;if(!document.hidden)poll=setTimeout(refresh,60000)}}}
$('older').onclick=()=>{if(!pageNext)return;pageHistory.push(pageCursor);pageCursor=pageNext;refresh()};$('newer').onclick=()=>{if(!pageHistory.length)return;pageCursor=pageHistory.pop();refresh()};
$('connect').onsubmit=e=>{e.preventDefault();key=$('token').value.trim();refresh()};$('refresh').onclick=refresh;
$('disconnect').onclick=()=>{stop();key='';try{sessionStorage.removeItem(storageKey);localStorage.removeItem(storageKey)}catch{}$('token').value='';$('connect').hidden=false;$('disconnect').hidden=true;$('refresh').disabled=true;$('drawings').replaceChildren();$('error').textContent=''};
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else if(key)refresh()});window.addEventListener('pagehide',stop);
if(automatic){key='local';$('connect').hidden=true;refresh()}else try{const remembered=localStorage.getItem(storageKey);key=sessionStorage.getItem(storageKey)||remembered||'';$('remember').checked=!!remembered;if(key)refresh()}catch{}
</script></html>
